<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanskriti Clinic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .whatsapp-float { position: fixed; right: 20px; bottom: 20px; z-index: 1000; padding: 15px; border-radius: 50%; background: #25d366; color: #fff; font-size: 24px; box-shadow: 2px 2px 5px rgba(0, 0, 0, .3); }
    .whatsapp-float:hover { background: #20b954; color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" id="clinicName" href="#"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#appointment" onclick="showSection('appointment')">Appointment</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact" onclick="showSection('contact')">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="bg-light text-center py-5">
    <div class="container">
      <h1 id="heroTitle"></h1>
      <p class="lead" id="heroSubtitle"></p>
      <a href="#appointment" class="btn btn-success me-2" id="heroAppointmentBtn" onclick="showSection('appointment')"></a>
      <a href="#contact" class="btn btn-primary" id="heroContactBtn" onclick="showSection('contact')"></a>
    </div>
  </section>

  <section id="services" class="py-5">
    <div class="container">
      <h2 class="text-center mb-4" id="servicesHeading"></h2>
      <div class="row g-4" id="servicesList"></div>
    </div>
  </section>

  <section id="about" class="py-5 bg-light">
    <div class="container"><h2 class="text-center mb-4" id="aboutHeading"></h2><p class="text-center" id="aboutDescription"></p></div>
  </section>

  <section id="appointment" class="bg-light py-5" style="display:none;">
    <div class="container">
      <h2 class="text-center mb-4" id="appointmentHeading"></h2>
      <form id="appointmentForm" action="https://formspree.io/f/xoeanvyq" method="POST" class="mx-auto" style="max-width: 700px;" novalidate>
        <input type="hidden" name="_redirect" value="false"><input type="hidden" name="form_type" value="appointment">
        <div class="mb-3"><label for="appt-name" class="form-label" id="apptNameLabel"></label><input type="text" class="form-control" name="appt_name" id="appt-name" required></div>
        <div class="mb-3"><label for="appt-mobile" class="form-label" id="apptMobileLabel"></label><input type="tel" class="form-control" name="appt_mobile" id="appt-mobile" required><div class="invalid-feedback" id="appt-mobile-error"></div></div>
        <div class="mb-3"><label for="appt-age" class="form-label" id="apptAgeLabel"></label><input type="number" class="form-control" name="appt_age" id="appt-age" required><div class="invalid-feedback" id="appt-age-error"></div></div>
        <div class="mb-3"><label for="appt-sex" class="form-label" id="apptSexLabel"></label><select class="form-select" name="appt_sex" id="appt-sex" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
        <div class="mb-3"><label for="apptDate" class="form-label" id="apptDateLabel"></label><select class="form-select" name="appt_date" id="apptDate" required><option value="">Select a date</option></select></div>
        <div class="mb-3"><label for="appt-time" class="form-label" id="apptTimeLabel"></label><select class="form-select" name="appt_time" id="appt-time" required disabled><option value="">Select a date first</option></select></div>
        <div class="mb-3"><label for="appt-department" class="form-label" id="apptDepartmentLabel"></label><select class="form-select" name="appt_department" id="appt-department" required><option value="">Select</option><option>General Medicine</option><option>Ayurveda</option><option>Women’s Health</option></select><div class="invalid-feedback" id="appt-department-error"></div></div>
        <div class="mb-3"><label for="appt-notes" class="form-label" id="apptNotesLabel"></label><textarea class="form-control" name="appt_notes" id="appt-notes"></textarea></div>
        <button type="submit" class="btn btn-success w-100" id="apptSubmitBtn"></button>
      </form>
    </div>
  </section>

  <section id="contact" class="bg-light py-5" style="display:none;">
    <div class="container">
      <h2 class="text-center mb-4" id="contactHeading"></h2>
      <form id="contactForm" action="https://formspree.io/f/xoeanvyq" method="POST" class="mx-auto" style="max-width: 600px;">
        <input type="hidden" name="_redirect" value="false"><input type="hidden" name="form_type" value="contact">
        <div class="mb-3"><label for="contact-name" class="form-label" id="contactNameLabel"></label><input type="text" class="form-control" name="name" id="contact-name" required></div>
        <div class="mb-3"><label for="contact-email" class="form-label" id="contactEmailLabel"></label><input type="email" class="form-control" name="email" id="contact-email" required></div>
        <div class="mb-3"><label for="contact-message" class="form-label" id="contactMessageLabel"></label><textarea class="form-control" name="message" id="contact-message" required></textarea></div>
        <button type="submit" class="btn btn-primary w-100" id="contactSubmitBtn"></button>
      </form>
    </div>
  </section>

  <section id="thankyou" class="py-5 text-center" style="display:none;"><div class="container"><i class="fas fa-check-circle fa-4x text-success mb-3"></i><h2 id="thankyouHeading"></h2><p id="thankyouMessage"></p><a href="#services" class="btn btn-outline-primary mt-3" id="thankyouBackBtn" onclick="showSection('services')"></a></div></section>

  <section id="testimonials" class="py-5 bg-light"><div class="container"><h2 class="text-center mb-4" id="testimonialsHeading"></h2><div id="testimonialsList" class="carousel slide" data-bs-ride="carousel"></div></div></section>

  <section id="faq" class="py-5"><div class="container"><h2 class="text-center mb-4" id="faqHeading"></h2><input id="faqSearch" class="form-control mb-3" type="search" placeholder="Search frequently asked questions" aria-label="Search frequently asked questions"><div class="accordion" id="faqAccordion"></div></div></section>

  <section id="map" class="py-5 bg-light"><div class="container"><h2 class="text-center mb-4" id="mapHeading"></h2><div class="ratio ratio-16x9"><iframe id="mapIframe" src="" title="Clinic location" style="border:0;" allowfullscreen loading="lazy"></iframe></div></div></section>
  <footer class="bg-dark text-white text-center py-3"><p class="mb-0" id="footerText"></p></footer>
  <a id="whatsappLink" href="#" class="whatsapp-float" target="_blank" rel="noopener noreferrer" title="WhatsApp Chat" aria-label="Chat with us on WhatsApp"><i class="fab fa-whatsapp"></i></a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import {
      populateHero, populateServices, populateAbout, populateAppointment, populateContact,
      populateThankYou, populateTestimonials, populateFAQ, populateMap, populateFooter,
      populateAppointmentDates, populateAppointmentSlots,
      populateWhatsApp, validateAppointmentForm
    } from './scripts/populate.js';

    const dynamicSections = ['appointment', 'contact', 'thankyou'];
    window.showSection = sectionId => {
      dynamicSections.forEach(id => { document.getElementById(id).style.display = id === sectionId ? 'block' : 'none'; });
      document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    async function submitForm(event, validate) {
      event.preventDefault();
      const form = event.currentTarget;
      if (validate && !validateAppointmentForm()) return;
      if (!form.checkValidity()) { form.reportValidity(); return; }
      const button = form.querySelector('[type="submit"]');
      button.disabled = true;
      try {
        const response = await fetch(form.action, { method: form.method, body: new FormData(form), headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error('Submission failed');
        form.reset();
        window.showSection('thankyou');
      } catch {
        window.alert('We could not submit your form. Please try again or contact the clinic directly.');
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById('appointmentForm').addEventListener('submit', event => submitForm(event, true));
    document.getElementById('contactForm').addEventListener('submit', event => submitForm(event, false));

    async function loadLabels() {
      const [labelsResponse, slotsResponse] = await Promise.all([
        fetch('config/labels.json'),
        fetch('config/slots.json')
      ]);
      if (!labelsResponse.ok || !slotsResponse.ok) throw new Error('Unable to load clinic information');
      const [data, slotsData] = await Promise.all([labelsResponse.json(), slotsResponse.json()]);
      document.getElementById('clinicName').textContent = data.clinicName;
      populateHero(data.hero); populateServices(data.services); populateAbout(data.about);
      populateAppointment(data.appointment); populateContact(data.contact); populateThankYou(data.thankyou);
      populateTestimonials(data.testimonials); populateFAQ(data.faq); populateMap(data.map);
      populateFooter(data.footer); populateWhatsApp(data.whatsapp);
      populateAppointmentDates(slotsData); populateAppointmentSlots(slotsData);
    }

    loadLabels().catch(() => {
      document.body.insertAdjacentHTML('afterbegin', '<div class="alert alert-danger m-3" role="alert">Unable to load clinic information. Please refresh the page.</div>');
    });
  </script>
</body>
</html>
